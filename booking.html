<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Appointment | Glory Salon</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: Poppins, sans-serif;
      background-color: #fff5f8;
      margin: 0;
      padding: 0;
      color: #6b2a3a;
    }

    /* HEADER */
    header {
      background: linear-gradient(90deg,#f48fb1,#f06292);
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 40px;
      height: 70px;
      box-shadow: 0 6px 20px rgba(160,60,100,0.15);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .left-header {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo-img {
      height: 75px;
      width: auto;
      border-radius: 10px;
    }

    .site-title {
      font-family: 'Great Vibes', cursive;
      font-size: 46px;
      letter-spacing: 4px;
      margin: 0;
      color: white;
      text-shadow: 2px 2px 5px rgba(0,0,0,0.2);
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-weight: 700;
      font-family: Poppins, sans-serif;
      font-size: 18px;
      letter-spacing: 0.5px;
      transition: 0.2s;
    }

    nav a:hover {
      opacity: 0.8;
    }

    /* CONTAINER FORM */
    .container {
      max-width: 700px;
      background: white;
      margin: 40px auto;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    h2 {
      text-align: center;
      color: #ec407a;
      margin-bottom: 20px;
      font-size: 28px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-family: Poppins, sans-serif;
    }

    button {
      background-color: #ec407a;
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 20px;
      font-family: Poppins, sans-serif;
      font-weight: 600;
    }

    button:hover {
      background-color: #d81b60;
    }

    footer {
      background: linear-gradient(90deg,#f48fb1,#f06292);
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 50px;
    }

    /* RESPONSIVE HEADER */
    @media screen and (max-width: 768px) {
      header {
        flex-direction: column;
        align-items: flex-start;
        padding: 12px 20px;
      }
      nav {
        margin-top: 8px;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="left-header">
      <img src="images/logo.jpg" class="logo-img" alt="Glory Salon Logo">
      <h1 class="site-title">Glory Salon</h1>
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="services.html">Services</a>
      <a href="booking.html">Book Now</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <!-- BOOKING FORM -->
  <div class="container">
    <h2>Book Your Appointment</h2>
    <form action="booking_process.php" method="POST">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="fullname" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="service">Select Service</label>
      <select id="service" name="service" required>
        <option value="">-- Choose Service --</option>
        <option value="Haircut">Haircut - RM25</option>
        <option value="Hair Coloring">Hair Coloring - RM80</option>
        <option value="Manicure">Manicure - RM40</option>
        <option value="Pedicure">Pedicure - RM45</option>
        <option value="Facial Treatment">Facial Treatment - RM70</option>
      </select>

      <label for="date">Select Date</label>
      <input type="date" id="date" name="date" required>

      <label for="time">Select Time</label>
      <select id="time" name="time" required>
        <option value="">-- Choose Time --</option>
        <option>10:00 AM</option>
        <option>11:00 AM</option>
        <option>12:00 PM</option>
        <option>2:00 PM</option>
        <option>3:00 PM</option>
        <option>4:00 PM</option>
      </select>

      <label for="note">Additional Notes</label>
      <textarea id="note" name="note" placeholder="Any special request..."></textarea>

      <button type="submit">Confirm Booking</button>
    </form>
  </div>

  <footer>
    © 2025 Glory Salon. All Rights Reserved.
  </footer>

</body>
</html>
